# Optional toggle key. Not installed for you, so your Hyprland config stays yours.
# Use an absolute path (see `command -v omakeys`): Hyprland often lacks
# ~/.cargo/bin on PATH. SUPER+ALT+O is unused by Omarchy defaults.
# SUPER+SHIFT+O is Obsidian on Omarchy: do not reuse it.
#
# Hyprland .conf:
bind = SUPER ALT, O, exec, $HOME/.cargo/bin/omakeys toggle
#
# Omarchy bindings.lua:
# o.bind("SUPER + ALT + O", "Omakeys overlay", "/home/you/.cargo/bin/omakeys toggle")
